; =====================================================================
;  Tacoma-ATC700-Standalone — v0.1
;  Standalone BMW E70 ATC700 transfer case controller for a 2016 Toyota
;  Tacoma swap, driven by the factory Tacoma 4WD dial + CAN telemetry.
;
;  Target: Seeed Studio XIAO ESP32-S3  (dual-core Xtensa LX7, FreeRTOS)
;  NOTE  : This MUST be the ESP32-**S3** XIAO. The XIAO ESP32-C3/C6 are
;          single-core and cannot support the pinned 2-core task split.
;
;  Build : pio run -e xiao_esp32s3
;  Flash : pio run -e xiao_esp32s3 -t upload   (USB-C, native USB CDC)
;  Monitor: pio device monitor
; =====================================================================

[env:xiao_esp32s3]
platform = espressif32@6.9.0        ; pinned — Arduino core 2.x (LEDC v2 API, see src/motor_task.cpp compat shim)
board    = seeed_xiao_esp32s3
framework = arduino

; --- USB CDC serial (XIAO's native USB port becomes `Serial`) ---------
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    -Wno-unused-parameter

monitor_speed = 115200
upload_speed  = 1500000             ; only used if you flash over UART instead of USB

; App partition: plenty for this firmware; frees room for future logging/OTA
board_build.partitions = huge_app.csv

; --- Libraries --------------------------------------------------------
lib_deps =
    ; MCP2515 CAN controller driver (SPI). Assumes a 16 MHz crystal module
    ; (e.g. the common blue "TJA1050 + MCP2515" boards) @ 500 kbit/s,
    ; which matches the 2016 Tacoma chassis/powertrain buses.
    coryjfowler/mcp_can @ ^1.5.0

; FreeRTOS is built into the ESP32 Arduino core — no library needed.

lib_ldf_mode = chain+
